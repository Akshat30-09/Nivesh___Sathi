en:[["SCORES – file a complaint","If a broker, depository participant or listed company wrongs you, first complain to them. If unresolved in 30 days, file on SEBI SCORES (scores.sebi.gov.in) with your client ID, dates and documents. Track status with your complaint number."],["Nominee registration","Add a nominee to every Demat account, bank account and mutual-fund folio. Without one, legal heirs face long paperwork to claim the holdings."],["Unclaimed dividends / shares (IEPF)","Dividends or shares unclaimed for 7 years move to the Investor Education & Protection Fund. You or legal heirs can still claim them through the IEPF Authority (iepf.gov.in) using form IEPF-5."],["Never share","Never share OTP, PIN, or install remote-access apps for 'help'. SEBI-registered entities never guarantee returns and never ask you to pay into a personal account."],["If you were scammed","Stop sending money. Save chats and receipts. Call cyber helpline 1930 or report at cybercrime.gov.in, tell your bank immediately, then complain on SCORES."]],
hi:[["SCORES – शिकायत दर्ज करें","ब्रोकर, डिपॉज़िटरी पार्टिसिपेंट या कंपनी से परेशानी हो तो पहले उन्हीं से शिकायत करें। 30 दिन में हल न हो तो SEBI SCORES (scores.sebi.gov.in) पर क्लाइंट ID, तारीख़ें व दस्तावेज़ के साथ दर्ज करें।"],["नॉमिनी पंजीकरण","हर डीमैट खाते, बैंक खाते और म्यूचुअल फंड फ़ोलियो में नॉमिनी जोड़ें। नहीं तो वारिसों को दावे में लंबी कागज़ी कार्यवाही झेलनी पड़ती है।"],["अदावाकृत लाभांश/शेयर (IEPF)","7 साल तक अदावाकृत लाभांश या शेयर निवेशक शिक्षा एवं संरक्षण कोष (IEPF) में चले जाते हैं। आप या वारिस IEPF-5 फॉर्म से iepf.gov.in पर दावा कर सकते हैं।"],["कभी साझा न करें","OTP, PIN साझा न करें, 'मदद' के नाम पर रिमोट-एक्सेस ऐप न डालें। SEBI-पंजीकृत संस्था कभी रिटर्न की गारंटी नहीं देती और निजी खाते में पैसा नहीं माँगती।"],["ठगी हो गई तो","पैसे भेजना बंद करें। चैट व रसीदें सहेजें। साइबर हेल्पलाइन 1930 पर कॉल करें या cybercrime.gov.in पर रिपोर्ट करें, तुरंत बैंक को बताएँ, फिर SCORES पर शिकायत करें।"]],
mr:[["SCORES – तक्रार नोंदवा","ब्रोकर, डिपॉझिटरी पार्टिसिपंट किंवा कंपनीकडून त्रास झाल्यास आधी त्यांच्याकडे तक्रार करा. 30 दिवसांत निराकरण न झाल्यास SEBI SCORES (scores.sebi.gov.in) वर क्लायंट ID, तारखा व कागदपत्रांसह नोंदवा."],["नामनिर्देशन (नॉमिनी)","प्रत्येक डिमॅट खाते, बँक खाते व म्युच्युअल फंड फोलिओत नॉमिनी जोडा. नसल्यास वारसांना दाव्यासाठी मोठी कागदोपत्री प्रक्रिया करावी लागते."],["दावा न केलेले लाभांश/शेअर (IEPF)","7 वर्षे दावा न केलेले लाभांश किंवा शेअर गुंतवणूकदार शिक्षण व संरक्षण निधीत (IEPF) जातात. तुम्ही किंवा वारस IEPF-5 फॉर्मने iepf.gov.in वर दावा करू शकता."],["कधीही शेअर करू नका","OTP, PIN शेअर करू नका; 'मदती'साठी रिमोट-अ‍ॅक्सेस अ‍ॅप इन्स्टॉल करू नका. SEBI-नोंदणीकृत संस्था परताव्याची हमी देत नाहीत व वैयक्तिक खात्यात पैसे मागत नाहीत."],["फसवणूक झाल्यास","पैसे पाठवणे थांबवा. चॅट व पावत्या जपून ठेवा. सायबर हेल्पलाइन 1930 वर कॉल करा किंवा cybercrime.gov.in वर तक्रार करा, बँकेला लगेच कळवा, मग SCORES वर तक्रार करा."]],
ta:[["SCORES – புகார் அளிக்க","தரகர், டெபாசிட்டரி பங்கேற்பாளர் அல்லது நிறுவனம் தவறிழைத்தால் முதலில் அவர்களிடம் புகார் செய்யுங்கள். 30 நாளில் தீர்வில்லையெனில் SEBI SCORES (scores.sebi.gov.in) இல் கிளையன்ட் ID, தேதிகள், ஆவணங்களுடன் பதிவு செய்யுங்கள்."],["நாமினி பதிவு","ஒவ்வொரு டிமேட், வங்கி கணக்கு, மியூச்சுவல் ஃபண்ட் ஃபோலியோவிலும் நாமினியைச் சேர்க்கவும். இல்லையெனில் வாரிசுகள் உரிமை கோர நீண்ட காகித வேலை செய்ய வேண்டும்."],["உரிமை கோரப்படாத ஈவுத்தொகை/பங்குகள் (IEPF)","7 ஆண்டுகள் கோரப்படாத ஈவுத்தொகை/பங்குகள் முதலீட்டாளர் கல்வி மற்றும் பாதுகாப்பு நிதிக்கு (IEPF) செல்லும். நீங்கள் அல்லது வாரிசுகள் IEPF-5 படிவம் மூலம் iepf.gov.in இல் கோரலாம்."],["ஒருபோதும் பகிராதீர்","OTP, PIN பகிர வேண்டாம்; 'உதவி'க்காக ரிமோட் ஆக்சஸ் செயலிகளை நிறுவ வேண்டாம். SEBI பதிவு பெற்றவர்கள் வருமான உத்தரவாதம் தர மாட்டார்கள், தனிநபர் கணக்கில் பணம் கேட்க மாட்டார்கள்."],["மோசடியில் சிக்கினால்","பணம் அனுப்புவதை நிறுத்துங்கள். அரட்டை, ரசீதுகளைச் சேமியுங்கள். சைபர் உதவி எண் 1930 அழைக்கவும் அல்லது cybercrime.gov.in இல் புகாரளிக்கவும், உடனே வங்கிக்குத் தெரிவித்து, பின் SCORES இல் புகார் செய்யுங்கள்."]]};

en:[["What is the stock market?","A share is a small ownership slice of a company. The stock market (NSE, BSE) is a regulated marketplace where buyers and sellers trade these shares. Prices move with demand and supply, company results, and news. SEBI is the regulator that protects investors."],["Demat & trading account","A Demat account holds your shares electronically, like a bank account holds money. A trading account places buy/sell orders. Open both only with a SEBI-registered broker, and keep your login, OTP and PIN to yourself."],["Order types","A market order buys or sells at the current price. A limit order executes only at the price you set. Know the difference before placing any order; practise in the virtual tab first."],["Risk, return & diversification","Higher possible return always comes with higher possible loss. No one can guarantee returns. Spreading money across different assets (diversification) reduces the damage if one of them falls. Never invest money you may need soon, such as emergency savings."],["Mutual funds & SIP","A mutual fund pools many people's money and a professional manager invests it. A SIP puts in a fixed small amount regularly, which builds discipline. Funds still carry market risk: read the risk label on the scheme."],["F&O and leverage: the biggest trap","Futures & Options let you take big positions with little money. SEBI's own studies found about 9 in 10 individual F&O traders make net losses. Leverage magnifies losses as fast as gains. Beginners should understand this fully before going near it."],["Fees & charges","Every trade has costs: brokerage, taxes, exchange and depository charges. Small costs add up when you trade often. Ask for the full charge list in writing."],["Healthy habits","Write down why you are investing and for how long. Do not act on tips, forwards or 'finfluencers'. Pause 24 hours before big decisions. Check any adviser on SEBI's list. Fear and greed are the real enemies."]],
hi:[["शेयर बाज़ार क्या है?","शेयर किसी कंपनी के मालिकाना हक़ का छोटा हिस्सा है। शेयर बाज़ार (NSE, BSE) एक नियंत्रित बाज़ार है जहाँ ख़रीदार और विक्रेता शेयरों का लेन-देन करते हैं। भाव माँग-आपूर्ति, कंपनी के नतीजों और ख़बरों से बदलते हैं। SEBI निवेशकों की रक्षा करने वाला नियामक है।"],["डीमैट और ट्रेडिंग खाता","डीमैट खाता आपके शेयर इलेक्ट्रॉनिक रूप में रखता है, जैसे बैंक खाता पैसे रखता है। ट्रेडिंग खाते से ख़रीद-बिक्री के ऑर्डर लगते हैं। दोनों केवल SEBI-पंजीकृत ब्रोकर से खोलें और लॉगिन, OTP, PIN किसी को न बताएँ।"],["ऑर्डर के प्रकार","मार्केट ऑर्डर मौजूदा भाव पर ख़रीदता/बेचता है। लिमिट ऑर्डर केवल आपके तय भाव पर पूरा होता है। ऑर्डर लगाने से पहले फ़र्क़ समझें; पहले वर्चुअल टैब में अभ्यास करें।"],["जोखिम, रिटर्न और विविधीकरण","ज़्यादा संभावित कमाई के साथ ज़्यादा संभावित नुक़सान भी आता है। कोई रिटर्न की गारंटी नहीं दे सकता। पैसा अलग-अलग जगह लगाने (विविधीकरण) से एक के गिरने पर नुक़सान कम होता है। जो पैसा जल्द चाहिए, जैसे आपातकालीन बचत, उसे कभी न लगाएँ।"],["म्यूचुअल फंड और SIP","म्यूचुअल फंड में कई लोगों का पैसा जुटाकर पेशेवर मैनेजर निवेश करता है। SIP में हर बार तय छोटी रक़म लगती है, जिससे अनुशासन बनता है। फंड में भी बाज़ार जोखिम रहता है: स्कीम का रिस्क-लेबल पढ़ें।"],["F&O और लीवरेज: सबसे बड़ा जाल","फ्यूचर्स और ऑप्शंस में थोड़े पैसे से बड़ा दाँव लगता है। SEBI के अपने अध्ययन में लगभग 10 में से 9 व्यक्तिगत F&O ट्रेडर्स को शुद्ध घाटा हुआ। लीवरेज घाटे को भी उतनी ही तेज़ी से बढ़ाता है। शुरुआती लोग इसे पूरी तरह समझे बिना इसके पास न जाएँ।"],["शुल्क और चार्ज","हर सौदे में लागत है: ब्रोकरेज, कर, एक्सचेंज और डिपॉज़िटरी शुल्क। बार-बार ट्रेड करने पर छोटी लागतें जुड़कर बड़ी हो जाती हैं। पूरा शुल्क-विवरण लिखित में माँगें।"],["स्वस्थ आदतें","लिखें कि आप क्यों और कितने समय के लिए निवेश कर रहे हैं। टिप, फ़ॉरवर्ड या 'फिनफ्लुएंसर' पर कदम न उठाएँ। बड़े फ़ैसले से पहले 24 घंटे रुकें। सलाहकार को SEBI की सूची में जाँचें। डर और लालच असली दुश्मन हैं।"]],
mr:[["शेअर बाजार म्हणजे काय?","शेअर म्हणजे कंपनीच्या मालकीचा छोटा हिस्सा. शेअर बाजार (NSE, BSE) हा नियंत्रित बाजार आहे जिथे खरेदीदार-विक्रेते शेअर्सचे व्यवहार करतात. भाव मागणी-पुरवठा, कंपनीचे निकाल आणि बातम्यांनुसार बदलतात. SEBI ही गुंतवणूकदारांचे संरक्षण करणारी नियामक संस्था आहे."],["डिमॅट आणि ट्रेडिंग खाते","डिमॅट खाते तुमचे शेअर्स इलेक्ट्रॉनिक स्वरूपात ठेवते, जसे बँक खाते पैसे ठेवते. ट्रेडिंग खात्यातून खरेदी-विक्री ऑर्डर दिल्या जातात. दोन्ही फक्त SEBI-नोंदणीकृत ब्रोकरकडे उघडा आणि लॉगिन, OTP, PIN कोणालाही सांगू नका."],["ऑर्डरचे प्रकार","मार्केट ऑर्डर सध्याच्या भावाने खरेदी/विक्री करते. लिमिट ऑर्डर फक्त तुम्ही ठरवलेल्या भावालाच पूर्ण होते. ऑर्डर देण्यापूर्वी फरक समजून घ्या; आधी आभासी टॅबमध्ये सराव करा."],["जोखीम, परतावा आणि विविधीकरण","जास्त संभाव्य नफ्यासोबत जास्त संभाव्य तोटाही येतो. कोणीही परताव्याची हमी देऊ शकत नाही. पैसे वेगवेगळ्या ठिकाणी गुंतवल्यास (विविधीकरण) एक घसरल्यास नुकसान कमी होते. लवकर लागणारे पैसे, जसे आपत्कालीन बचत, कधीही गुंतवू नका."],["म्युच्युअल फंड आणि SIP","म्युच्युअल फंडात अनेकांचे पैसे एकत्र करून व्यावसायिक व्यवस्थापक गुंतवतो. SIP मध्ये ठराविक छोटी रक्कम नियमित गुंतवली जाते, यातून शिस्त लागते. फंडातही बाजार जोखीम असते: योजनेचे रिस्क-लेबल वाचा."],["F&O आणि लिव्हरेज: सर्वात मोठा सापळा","फ्युचर्स आणि ऑप्शन्समध्ये थोड्या पैशांत मोठा डाव लावता येतो. SEBI च्या स्वतःच्या अभ्यासात सुमारे 10 पैकी 9 वैयक्तिक F&O ट्रेडर्सना निव्वळ तोटा झाला. लिव्हरेज तोटाही तितकाच वेगाने वाढवते. नवशिक्यांनी हे पूर्ण समजल्याशिवाय त्याजवळ जाऊ नये."],["शुल्क आणि चार्जेस","प्रत्येक व्यवहारात खर्च असतो: ब्रोकरेज, कर, एक्स्चेंज व डिपॉझिटरी शुल्क. वारंवार ट्रेड केल्यास छोटे खर्च मोठे होतात. पूर्ण शुल्क यादी लेखी मागा."],["निरोगी सवयी","तुम्ही का आणि किती काळासाठी गुंतवणूक करत आहात ते लिहा. टिप, फॉरवर्ड किंवा 'फिनफ्लुएन्सर' यांवर कृती करू नका. मोठ्या निर्णयापूर्वी 24 तास थांबा. सल्लागार SEBI च्या यादीत तपासा. भीती आणि लोभ हे खरे शत्रू आहेत."]],
ta:[["பங்குச் சந்தை என்றால் என்ன?","பங்கு என்பது ஒரு நிறுவனத்தின் உரிமையில் சிறு பகுதி. பங்குச் சந்தை (NSE, BSE) என்பது வாங்குபவர்களும் விற்பவர்களும் பங்குகளை வர்த்தகம் செய்யும் ஒழுங்குபடுத்தப்பட்ட சந்தை. தேவை-வழங்கல், நிறுவன முடிவுகள், செய்திகளால் விலை மாறும். SEBI முதலீட்டாளர்களைப் பாதுகாக்கும் ஒழுங்குமுறை அமைப்பு."],["டிமேட் & வர்த்தகக் கணக்கு","வங்கிக் கணக்கு பணத்தை வைத்திருப்பது போல், டிமேட் கணக்கு உங்கள் பங்குகளை மின்னணு வடிவில் வைத்திருக்கும். வர்த்தகக் கணக்கு மூலம் வாங்க/விற்க ஆர்டர் இடலாம். இரண்டையும் SEBI பதிவு பெற்ற தரகரிடம் மட்டுமே திறங்கள்; உள்நுழைவு, OTP, PIN யாரிடமும் பகிர வேண்டாம்."],["ஆர்டர் வகைகள்","மார்க்கெட் ஆர்டர் தற்போதைய விலையில் வாங்கும்/விற்கும். லிமிட் ஆர்டர் நீங்கள் நிர்ணயித்த விலையில் மட்டுமே நிறைவேறும். ஆர்டர் இடும் முன் வேறுபாட்டை அறியுங்கள்; முதலில் மெய்நிகர் தாவலில் பயிற்சி செய்யுங்கள்."],["ஆபத்து, வருவாய் & பல்வகைப்படுத்தல்","அதிக வருவாய் வாய்ப்புடன் அதிக நஷ்ட வாய்ப்பும் வரும். வருவாய்க்கு யாரும் உத்தரவாதம் தர முடியாது. பணத்தை பல இடங்களில் பிரித்து வைத்தால் (பல்வகைப்படுத்தல்) ஒன்று சரிந்தாலும் இழப்பு குறையும். விரைவில் தேவைப்படும் பணத்தை, அவசரகாலச் சேமிப்பை, ஒருபோதும் முதலீடு செய்யாதீர்."],["மியூச்சுவல் ஃபண்ட் & SIP","மியூச்சுவல் ஃபண்டில் பலரின் பணத்தை திரட்டி நிபுணர் மேலாளர் முதலீடு செய்வார். SIP என்பது நிலையான சிறு தொகையை தொடர்ந்து முதலீடு செய்வது; இது ஒழுக்கத்தை உருவாக்கும். ஃபண்டிலும் சந்தை ஆபத்து உண்டு: திட்டத்தின் ரிஸ்க் லேபிளைப் படியுங்கள்."],["F&O & லெவரேஜ்: மிகப்பெரிய ஆபத்து","ஃப்யூச்சர்ஸ் & ஆப்ஷன்ஸில் சிறு பணத்தில் பெரிய நிலை எடுக்கலாம். SEBI ஆய்வின்படி சுமார் 10 தனிநபர் F&O வர்த்தகர்களில் 9 பேர் நிகர நஷ்டம் அடைகின்றனர். லெவரேஜ் நஷ்டத்தையும் அதே வேகத்தில் பெருக்கும். தொடக்கநிலையினர் முழுமையாகப் புரிந்த பின்பே இதை அணுக வேண்டும்."],["கட்டணங்கள்","ஒவ்வொரு வர்த்தகத்திலும் செலவு உண்டு: தரகுக் கட்டணம், வரிகள், பரிவர்த்தனை, டெபாசிட்டரி கட்டணங்கள். அடிக்கடி வர்த்தகம் செய்தால் சிறு செலவுகள் பெரிதாகும். முழு கட்டணப் பட்டியலை எழுத்தில் கேளுங்கள்."],["ஆரோக்கியமான பழக்கங்கள்","ஏன், எவ்வளவு காலத்திற்கு முதலீடு செய்கிறீர்கள் என்று எழுதுங்கள். டிப், ஃபார்வர்டு, 'ஃபின்ஃப்ளூயன்சர்' பேச்சில் செயல்பட வேண்டாம். பெரிய முடிவுக்கு முன் 24 மணி நேரம் காத்திருங்கள். ஆலோசகரை SEBI பட்டியலில் சரிபாருங்கள். பயமும் பேராசையுமே உண்மையான எதிரிகள்."]]};
let L="en",tab=0,S={};
const $=id=>document.getElementById(id),t=k=>T[L][k];
const REG=/^(INZ|INH|INA|INP|INM|INB|INF|INC|INR|INK|IN-DP|INT|INV)[-\s]?[A-Z0-9-]*\d{5,}$/i;
const IC=["🔍","📈","⚖️","📘","💬"],SH={en:["Check","Practice","Rights","Learn","Ask"],hi:["जाँचें","अभ्यास","अधिकार","सीखें","पूछें"],mr:["तपासा","सराव","हक्क","शिका","विचारा"],ta:["சரிபார்","பயிற்சி","உரிமை","கற்க","கேள்"]};
function tabs(){$("nav").innerHTML=SH[L].map((x,i)=>`<button class="${i==tab?'on':''}" ${i==tab?'aria-current="page"':''} onclick="tab=${i};show();scrollTo(0,0)"><span aria-hidden="true">${IC[i]}</span>${x}</button>`).join("")}
function show(){tabs();[0,1,2,3,4].forEach(i=>$("t"+i).hidden=i!=tab)}
function render(){document.documentElement.lang=L;$("sub").textContent=t("sub");$("foot").textContent=t("foot");
$("t0").innerHTML=`<div class="card"><h2>${t("h0")}</h2><label class="mut">${t("reg")}</label><input id="rg"><p></p><textarea id="tx" placeholder="${t("paste")}"></textarea>
<p class="row"><span class="mut">${EX[L].l}</span><button class="chip" onclick="ex(0)">${EX[L].a}</button><button class="chip" onclick="ex(1)">${EX[L].b}</button></p><p class="row"><button class="pri" onclick="check()">${t("go")}</button><a href="https://www.sebi.gov.in" target="_blank" rel="noopener"><button>${t("verify")} ↗</button></a></p></div><div id="out"></div>`;
$("t2").innerHTML=`<div class="card"><h2>${t("h2")}</h2>${R[L].map(r=>`<details><summary>${r[0]}</summary><p>${r[1]}</p>${LB()}</details>`).join("")}</div>`;
$("t3").innerHTML=`<div class="card"><h2>${LH[L]}</h2>${LR[L].map((r,i)=>`<details ${i==0?'open':''}><summary>${i+1}. ${r[0]}</summary><p>${r[1]}</p>${LB()}</details>`).join("")}</div>`;
$("t1").innerHTML='<div id="tp"></div><div id="gl"></div>';$("gl").innerHTML=`<div class="card"><h2>${GL[L].gh}</h2>${GT[L].map(r=>`<details><summary>${r[0]}</summary><p>${r[1]}</p>${LB()}</details>`).join("")}</div>`;
friendly();drawChat();draw();show()}
function check(){const rg=$("rg").value.trim(),tx=$("tx").value;let sc=0,h="";

const GT={en:[["Bid, Ask & Spread","Bid is the highest price a buyer offers; ask is the lowest price a seller wants. The gap between them is the spread, a hidden cost of trading."],["Volume","The number of shares traded in a period. High volume means many people are trading; low volume can make prices jump easily."],["Market capitalisation","Share price multiplied by total shares. It shows a company's size: large-cap, mid-cap or small-cap. Smaller companies are usually more volatile."],["Volatility","How sharply and how often a price moves up and down. High volatility means bigger possible gains and bigger possible losses."],["Bull & Bear market","A bull market is a long period of rising prices; a bear market is a long period of falling prices. Nobody can predict when they start or end."],["Stop-loss","An order that sells automatically if the price falls to a level you chose, to limit a loss. It is not a guarantee: in fast crashes the sale can happen at a lower price."],["Circuit limit","The maximum a stock may rise or fall in a day. Trading halts at the limit to cool panic and greed. You may be unable to sell during a lower circuit."],["Margin & leverage","Borrowing or using a deposit to trade larger than your own money. Losses grow as fast as gains and can exceed what you put in."],["Dividend","A share of company profit paid to shareholders. It is not guaranteed and the share price usually adjusts when it is paid."],["Realised vs unrealised P&L","Unrealised profit or loss exists on paper while you still hold the share. It becomes realised only when you sell."],["Index (Nifty 50, Sensex)","A basket of large companies that shows the overall mood of the market. An index is a measure, not something you can buy directly."]],
hi:[["बिड, आस्क और स्प्रेड","बिड वह सबसे ऊँचा भाव है जो ख़रीदार देने को तैयार है; आस्क वह सबसे कम भाव जिस पर विक्रेता बेचना चाहता है। दोनों का अंतर स्प्रेड है, जो ट्रेडिंग की छिपी लागत है।"],["वॉल्यूम","किसी अवधि में कितने शेयर ख़रीदे-बेचे गए। ज़्यादा वॉल्यूम यानी बहुत लोग ट्रेड कर रहे हैं; कम वॉल्यूम में भाव आसानी से उछल सकता है।"],["मार्केट कैपिटलाइज़ेशन","शेयर भाव गुणा कुल शेयर। यह कंपनी का आकार बताता है: लार्ज-कैप, मिड-कैप या स्मॉल-कैप। छोटी कंपनियाँ आमतौर पर ज़्यादा उतार-चढ़ाव वाली होती हैं।"],["वोलैटिलिटी (उतार-चढ़ाव)","भाव कितनी तेज़ी और कितनी बार ऊपर-नीचे होता है। ज़्यादा वोलैटिलिटी यानी बड़ा संभावित लाभ और बड़ा संभावित नुक़सान।"],["बुल और बेयर मार्केट","बुल मार्केट में लंबे समय तक भाव बढ़ते हैं; बेयर मार्केट में लंबे समय तक गिरते हैं। इनकी शुरुआत या अंत कोई पहले से नहीं बता सकता।"],["स्टॉप-लॉस","ऐसा ऑर्डर जो भाव आपके तय स्तर तक गिरते ही अपने आप बेच देता है, ताकि नुक़सान सीमित रहे। यह गारंटी नहीं है: तेज़ गिरावट में बिक्री और नीचे भाव पर हो सकती है।"],["सर्किट लिमिट","एक दिन में शेयर अधिकतम कितना बढ़ या गिर सकता है। सीमा पर ट्रेडिंग रुक जाती है ताकि घबराहट और लालच शांत हो। लोअर सर्किट में आप बेच न पाएँ, ऐसा हो सकता है।"],["मार्जिन और लीवरेज","उधार या जमा राशि पर अपने पैसे से बड़ा ट्रेड करना। नुक़सान भी उतनी ही तेज़ी से बढ़ता है और लगाई रक़म से ज़्यादा हो सकता है।"],["लाभांश (डिविडेंड)","कंपनी के मुनाफ़े का हिस्सा जो शेयरधारकों को मिलता है। यह तय नहीं होता और भुगतान पर शेयर का भाव आमतौर पर समायोजित हो जाता है।"],["वास्तविक बनाम अवास्तविक लाभ/हानि","जब तक शेयर आपके पास है, लाभ या हानि केवल कागज़ पर (अवास्तविक) है। बेचने पर ही वह वास्तविक बनती है।"],["इंडेक्स (निफ्टी 50, सेंसेक्स)","बड़ी कंपनियों की टोकरी जो बाज़ार का कुल मिज़ाज दिखाती है। इंडेक्स एक पैमाना है, इसे सीधे ख़रीदा नहीं जा सकता।"]],
mr:[["बिड, आस्क आणि स्प्रेड","बिड म्हणजे खरेदीदार देऊ करत असलेला सर्वाधिक भाव; आस्क म्हणजे विक्रेत्याला हवा असलेला सर्वात कमी भाव. दोघांतील फरक म्हणजे स्प्रेड, ट्रेडिंगचा छुपा खर्च."],["व्हॉल्यूम","ठराविक काळात किती शेअर्सचे व्यवहार झाले. जास्त व्हॉल्यूम म्हणजे अनेक जण ट्रेड करत आहेत; कमी व्हॉल्यूममध्ये भाव सहज उसळू शकतो."],["मार्केट कॅपिटलायझेशन","शेअर भाव गुणिले एकूण शेअर्स. यातून कंपनीचा आकार कळतो: लार्ज-कॅप, मिड-कॅप किंवा स्मॉल-कॅप. लहान कंपन्यांमध्ये सहसा जास्त चढ-उतार असतात."],["व्होलॅटिलिटी (चढ-उतार)","भाव किती वेगाने आणि किती वेळा वर-खाली होतो. जास्त व्होलॅटिलिटी म्हणजे मोठा संभाव्य नफा आणि मोठा संभाव्य तोटा."],["बुल आणि बेअर मार्केट","बुल मार्केटमध्ये दीर्घकाळ भाव वाढतात; बेअर मार्केटमध्ये दीर्घकाळ घसरतात. त्यांची सुरुवात किंवा शेवट कोणीही आधी सांगू शकत नाही."],["स्टॉप-लॉस","भाव तुम्ही ठरवलेल्या पातळीला आला की आपोआप विक्री करणारा ऑर्डर, तोटा मर्यादित ठेवण्यासाठी. ही हमी नाही: वेगवान घसरणीत विक्री आणखी कमी भावाने होऊ शकते."],["सर्किट लिमिट","एका दिवसात शेअर जास्तीत जास्त किती वाढू किंवा घसरू शकतो. मर्यादेवर ट्रेडिंग थांबते जेणेकरून भीती व लोभ शांत व्हावा. लोअर सर्किटमध्ये तुम्हाला विकता न येणे शक्य आहे."],["मार्जिन आणि लिव्हरेज","कर्ज किंवा ठेव वापरून स्वतःच्या पैशांपेक्षा मोठा ट्रेड करणे. तोटाही तितक्याच वेगाने वाढतो आणि गुंतवलेल्या रकमेपेक्षा जास्त होऊ शकतो."],["लाभांश (डिव्हिडंड)","कंपनीच्या नफ्याचा वाटा जो भागधारकांना मिळतो. तो निश्चित नसतो आणि देताना शेअरचा भाव सहसा समायोजित होतो."],["वास्तविक विरुद्ध अवास्तविक नफा/तोटा","शेअर जवळ असेपर्यंत नफा किंवा तोटा फक्त कागदावर (अवास्तविक) असतो. विकल्यावरच तो वास्तविक होतो."],["निर्देशांक (निफ्टी 50, सेन्सेक्स)","मोठ्या कंपन्यांची टोपली जी बाजाराचा एकूण कल दाखवते. निर्देशांक हे मोजमाप आहे, तो थेट खरेदी करता येत नाही."]],
ta:[["பிட், ஆஸ்க் & ஸ்ப்ரெட்","பிட் என்பது வாங்குபவர் தர விரும்பும் அதிகபட்ச விலை; ஆஸ்க் என்பது விற்பவர் கேட்கும் குறைந்தபட்ச விலை. இரண்டுக்கும் இடைவெளி ஸ்ப்ரெட், வர்த்தகத்தின் மறைமுகச் செலவு."],["வால்யூம்","ஒரு காலத்தில் எத்தனை பங்குகள் வர்த்தகம் ஆயின. அதிக வால்யூம் என்றால் பலர் வர்த்தகம் செய்கிறார்கள்; குறைந்த வால்யூமில் விலை எளிதில் துள்ளும்."],["சந்தை மூலதனம்","பங்கு விலை × மொத்த பங்குகள். நிறுவனத்தின் அளவை (லார்ஜ், மிட், ஸ்மால் கேப்) காட்டும். சிறிய நிறுவனங்கள் பொதுவாக அதிக ஏற்ற இறக்கம் கொண்டவை."],["வோலாட்டிலிட்டி (ஏற்ற இறக்கம்)","விலை எவ்வளவு வேகமாகவும் அடிக்கடியும் மேலும் கீழும் செல்கிறது என்பது. அதிக வோலாட்டிலிட்டி என்றால் பெரிய லாபமும் பெரிய நஷ்டமும் சாத்தியம்."],["புல் & பியர் சந்தை","புல் சந்தையில் நீண்ட காலம் விலைகள் உயரும்; பியர் சந்தையில் நீண்ட காலம் சரியும். அவை எப்போது தொடங்கும், முடியும் என்பதை யாராலும் முன்கூட்டிச் சொல்ல முடியாது."],["ஸ்டாப்-லாஸ்","நீங்கள் தேர்ந்த விலைக்கு வந்ததும் தானாக விற்கும் ஆர்டர், நஷ்டத்தைக் குறைக்க. இது உத்தரவாதம் அல்ல: வேகமான சரிவில் இன்னும் குறைந்த விலையில் விற்பனை நடக்கலாம்."],["சர்க்யூட் வரம்பு","ஒரு நாளில் பங்கு அதிகபட்சம் எவ்வளவு உயரலாம் அல்லது சரியலாம். பயமும் பேராசையும் தணிய வரம்பில் வர்த்தகம் நிறுத்தப்படும். லோயர் சர்க்யூட்டில் உங்களால் விற்க முடியாமல் போகலாம்."],["மார்ஜின் & லெவரேஜ்","கடன் அல்லது டெபாசிட் மூலம் சொந்தப் பணத்தை விட பெரிய வர்த்தகம் செய்வது. நஷ்டமும் அதே வேகத்தில் பெருகி, போட்ட தொகையைவிட அதிகமாகலாம்."],["ஈவுத்தொகை (டிவிடெண்ட்)","நிறுவன லாபத்தில் பங்குதாரர்களுக்கு வழங்கப்படும் பங்கு. இது உறுதி அல்ல; வழங்கும்போது பங்கு விலை பொதுவாகச் சரிசெய்யப்படும்."],["உண்மை vs காகித லாப/நஷ்டம்","பங்கு உங்களிடம் இருக்கும் வரை லாபமோ நஷ்டமோ காகிதத்தில் (நிகழாதது) மட்டுமே. விற்கும்போதுதான் அது உண்மையாகும்."],["குறியீடு (நிஃப்டி 50, சென்செக்ஸ்)","பெரிய நிறுவனங்களின் தொகுப்பு; சந்தையின் ஒட்டுமொத்த நிலையைக் காட்டும். குறியீடு ஒரு அளவீடு, அதை நேரடியாக வாங்க முடியாது."]]};
function ln(a,c){const w=300,h=100,mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;const p=a.map((v,i)=>(a.length>1?i*w/(a.length-1):0).toFixed(1)+","+(h-8-(v-mn)/r*(h-16)).toFixed(1)).join(" ");return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" style="display:block"><polyline points="${p}" fill="none" style="stroke:var(${c})" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="mut">${fmt(mn)} – ${fmt(mx)}</div>`}
